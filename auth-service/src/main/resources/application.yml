server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow_db?TimeZone=UTC
    username: ${AUTH_DB_USER:auth_runtime}
    password: ${AUTH_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth_schema
    show-sql: false

  flyway:
    enabled: true
    schemas: auth_schema
    default-schema: auth_schema
    table: flyway_schema_history
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

jwt:
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:orderflow-auth}
  audience: ${JWT_AUDIENCE:orderflow-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
server.address: ${SERVICE_BIND_ADDRESS:127.0.0.1}
bootstrap:
  customer:
    email: ${BOOTSTRAP_CUSTOMER_EMAIL:}
    password: ${BOOTSTRAP_CUSTOMER_PASSWORD:}
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

observability.environment: ${APP_ENV:local}
observability.readiness.enforce: true
management.server.address: ${MANAGEMENT_ADDRESS:127.0.0.1}
management.server.port: ${MANAGEMENT_PORT:9081}
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.liveness.include: livenessState
management.endpoint.health.group.readiness.include: '*'
management.metrics.tags.service: ${spring.application.name}
management.metrics.tags.environment: ${APP_ENV:local}
management.cloudwatch.metrics.export.enabled: ${CLOUDWATCH_METRICS_ENABLED:false}
management.cloudwatch.metrics.export.namespace: OrderFlow
management.cloudwatch.metrics.export.step: 1m

spring.http.converters.preferred-json-mapper: jackson2
