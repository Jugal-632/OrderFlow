server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Auth routes — no JWT check
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        # Order routes — JWT required
        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**
          filters:
            - name: JwtAuthFilter

        # Inventory routes — JWT required
        - id: inventory-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/inventory/**
          filters:
            - name: JwtAuthFilter

      default-filters:
        - name: CorrelationIdFilter

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info