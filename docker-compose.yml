name: orderflow
x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: compose
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow_db
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/local_env.py for local development}
  SPRING_FLYWAY_ENABLED: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
  SERVICE_BIND_ADDRESS: 0.0.0.0
  APP_ENV: compose
  INVENTORY_SERVICE_URL: http://inventory-service:8083
  NOTIFICATION_SERVICE_URL: http://notification-service:8084
x-app: &app
  profiles: [compose]
  init: true
  restart: unless-stopped
  mem_limit: 768m
  cpus: 2
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    kafka: {condition: service_healthy}
services:
  postgres:
    image: postgres:15.6
    # Issue writeback in smaller batches to reduce checkpoint fsync stalls.
    command: [postgres, -c, checkpoint_flush_after=64kB, -c, bgwriter_flush_after=64kB]
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: orderflow_db
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./containers/init-db.sh:/docker-entrypoint-initdb.d/01-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow_db"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.2.4-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, always]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: [CMD, cub, zk-ready, "localhost:2181", "5"]
      interval: 10s
      timeout: 8s
      retries: 30
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper: {condition: service_healthy}
    ports: ["127.0.0.1:${KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: [CMD, kafka-topics, --bootstrap-server, localhost:29092, --list]
      interval: 10s
      timeout: 8s
      retries: 30
    volumes: [kafka-data:/var/lib/kafka/data]
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka: {condition: service_healthy}
    ports: ["127.0.0.1:${KAFKA_UI_PORT:-8090}:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: orderflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
  auth-service:
    <<: *app
    image: orderflow/auth-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      <<: *app-env
      SERVER_PORT: "8081"
      MANAGEMENT_PORT: "9081"
      SPRING_DATASOURCE_USERNAME: auth_runtime
      BOOTSTRAP_CUSTOMER_EMAIL: ${BOOTSTRAP_CUSTOMER_EMAIL:-}
      BOOTSTRAP_CUSTOMER_PASSWORD: ${BOOTSTRAP_CUSTOMER_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  order-service:
    <<: *app
    image: orderflow/order-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      <<: *app-env
      SERVER_PORT: "8082"
      MANAGEMENT_PORT: "9082"
      SPRING_DATASOURCE_USERNAME: order_runtime
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Kolkata -XX:InitialRAMPercentage=65 -XX:MaxRAMPercentage=65
  inventory-service:
    <<: *app
    image: orderflow/inventory-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      <<: *app-env
      SERVER_PORT: "8083"
      MANAGEMENT_PORT: "9083"
      SPRING_DATASOURCE_USERNAME: inventory_runtime
  notification-service:
    <<: *app
    image: orderflow/notification-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      <<: *app-env
      SERVER_PORT: "8084"
      MANAGEMENT_PORT: "9084"
      SPRING_DATASOURCE_USERNAME: notification_runtime
  api-gateway:
    <<: *app
    image: orderflow/api-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      <<: *app-env
      SERVER_PORT: "8080"
      MANAGEMENT_PORT: "9080"
      AUTH_SERVICE_URL: http://auth-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports: ["127.0.0.1:${GATEWAY_PORT:-8080}:8080"]
    depends_on:
      redis: {condition: service_healthy}
      auth-service: {condition: service_healthy}
      order-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
  frontend:
    profiles: [compose]
    image: orderflow/frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      GATEWAY_URL: http://api-gateway:8080
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:5173"]
    depends_on:
      api-gateway: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  postgres-data:
  redis-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:

