name: OrderFlow verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Unit, contract, migration and integration tests
        run: |
          chmod +x mvnw
          ./mvnw -q -B verify -Dapi.version=1.44
      - name: Frontend syntax, tests and browser contracts
        working-directory: frontend
        run: |
          npm ci
          node --check app.js
          node --check client.js
          node --check server.mjs
          npm test
          npx playwright install --with-deps chrome
          npx playwright test tests/browser/dashboard.spec.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-${{ github.sha }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            docs/evidence/*browser-results.json
  containers:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Quiet clean builds and startup
        run: |
          mkdir -p docs/evidence/phase10
          python3 scripts/local_env.py
          docker compose --env-file .env --profile compose -p orderflow-phase10 config -q
          docker compose --env-file .env --profile compose -p orderflow-phase10 build -q
          docker compose --env-file .env --profile compose -p orderflow-phase10 up -d --quiet-pull --wait --wait-timeout 600
      - name: Real stack smoke, authorization, cancellation and chaos
        run: |
          python3 scripts/inspect-phase10-artifacts.py
          python3 scripts/verify-phase10.py
      - name: Image inventory and vulnerability/secret gates
        run: |
          scanner=aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          status=0
          for service in auth-service order-service inventory-service notification-service api-gateway frontend; do
            image="orderflow/$service:$IMAGE_TAG"
            docker image inspect "$image" > "docs/evidence/phase10/$service-image.json"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v orderflow-trivy-cache:/root/.cache/trivy -v "$PWD/docs/evidence/phase10:/reports" "$scanner" image --quiet --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --format json --output "/reports/$service-scan.json" "$image" || status=1
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v orderflow-trivy-cache:/root/.cache/trivy -v "$PWD/docs/evidence/phase10:/reports" "$scanner" image --quiet --format cyclonedx --output "/reports/$service-sbom.json" "$image" || status=1
          done
          exit "$status"
      - name: Capture diagnostics
        if: always()
        run: |
          docker compose --env-file .env --profile compose -p orderflow-phase10 ps --format json > docs/evidence/phase10/containers.json
          docker compose --env-file .env --profile compose -p orderflow-phase10 logs --no-color > docs/evidence/phase10/compose.log
          docker compose --env-file .env --profile compose -p orderflow-phase10 down
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: containers-${{ github.sha }}
          path: docs/evidence/phase10/
